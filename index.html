<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>韩立的后宫 🎀 | 姚蔓.xyz</title>
<style>
  :root{
    --bg:#fff6fa; --card:#ffffff; --pink:#f473b9; --pink2:#fbadd3;
    --red:#e6003e; --text:#5b3448; --muted:#b98ca2; --line:#f9d6e6;
    --glass:rgba(244,115,185,0.08); --glass-border:rgba(244,115,185,0.28);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.7;
    background-image:
      radial-gradient(circle, rgba(255,255,255,0.8) 2px, transparent 2px),
      radial-gradient(circle at 15% 20%, #ffe0ef 0, transparent 45%),
      radial-gradient(circle at 85% 75%, #ffe6f1 0, transparent 45%);
    background-size: 42px 42px, auto, auto;
    min-height:100vh; overflow-x:hidden;
  }
  .sakura{
    position:fixed; top:-10px; z-index:0; pointer-events:none;
    background:#ffb7c5; border-radius:50% 0 50% 50%;
    animation:fall linear forwards;
  }
  @keyframes fall{
    0%{transform:translateY(0) rotate(0deg);opacity:1;}
    100%{transform:translateY(100vh) rotate(360deg);opacity:0;}
  }
  .page{position:relative;z-index:1;animation:fadeIn .4s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(15px);}to{opacity:1;transform:translateY(0);}}
  header{text-align:center;padding:40px 20px 20px;}
  .avatar-box{
    width:110px;height:110px;margin:0 auto 15px;border-radius:50%;
    background:#fff;border:3px solid var(--pink);
    box-shadow:0 0 22px rgba(244,115,185,0.45);
  }
  .avatar-box svg{width:100%;height:100%;display:block;}
  h1{font-size:26px;color:var(--red);margin-bottom:5px;font-weight:bold;}
  .tagline{color:var(--muted);font-size:14px;}
  section{max-width:600px;margin:0 auto;padding:15px 15px 40px;}
  .card{
    background:var(--card);border:2px solid var(--line);border-radius:22px;
    padding:18px;margin-bottom:15px;
    box-shadow:0 8px 20px rgba(244,115,185,0.16);
  }
  .card h2{font-size:18px;color:var(--pink);margin-bottom:12px;display:flex;align-items:center;gap:8px;}

  .music-player{display:flex;align-items:center;gap:12px;background:var(--glass);padding:12px;border-radius:16px;border:1px solid var(--glass-border);}
  .music-player audio{display:none;}
  .music-controls{display:flex;gap:6px;}
  .music-btn{
    width:40px;height:40px;border-radius:50%;background:var(--pink);border:none;
    color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 10px rgba(244,115,185,0.35);
  }
  .music-btn:active{transform:scale(.92);}
  .music-info{flex:1;overflow:hidden;}
  .music-info .title{font-size:14px;font-weight:bold;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .music-info .artist{font-size:12px;color:var(--muted);}
  .music-select{
    width:100%;margin-top:10px;padding:9px;border-radius:12px;
    background:#fff;color:var(--text);border:1px solid var(--line);
    font-size:14px;outline:none;
  }

  .song-list{margin-top:10px;}
  .song-item{
    display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;
    cursor:pointer;font-size:14px;transition:.15s;border:1px solid transparent;
  }
  .song-item:active{background:rgba(244,115,185,0.12);}
  .song-item.playing{background:var(--glass);border-color:var(--glass-border);}
  .song-item .idx{width:20px;color:var(--muted);font-size:12px;text-align:center;}
  .song-item.playing .idx{color:var(--pink);}
  .song-item .nm{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  .song-item.playing .nm{color:var(--pink);font-weight:bold;}
</style>
</head>
<body>

<div id="page-home" class="page">
  <header>
    <div class="avatar-box">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="48" cy="50" rx="22" ry="30" fill="#ffffff" stroke="#f6c9d8" stroke-width="3"/>
        <ellipse cx="152" cy="50" rx="22" ry="30" fill="#ffffff" stroke="#f6c9d8" stroke-width="3"/>
        <ellipse cx="100" cy="115" rx="75" ry="63" fill="#ffffff" stroke="#f6c9d8" stroke-width="3"/>
        <g transform="translate(152,46)">
          <ellipse cx="-16" cy="-1" rx="15" ry="9" fill="#e6003e" transform="rotate(-22)"/>
          <ellipse cx="16" cy="-1" rx="15" ry="9" fill="#e6003e" transform="rotate(22)"/>
          <circle cx="0" cy="1" r="6.5" fill="#cc0038"/>
        </g>
        <ellipse cx="77" cy="105" rx="7.5" ry="12" fill="#1b1b1b"/>
        <ellipse cx="123" cy="105" rx="7.5" ry="12" fill="#1b1b1b"/>
        <ellipse cx="100" cy="122" rx="10" ry="7" fill="#f6b73c"/>
        <ellipse cx="63" cy="128" rx="10" ry="6" fill="#ffb6c1" opacity="0.55"/>
        <ellipse cx="137" cy="128" rx="10" ry="6" fill="#ffb6c1" opacity="0.55"/>
        <g stroke="#c39aa8" stroke-width="2.5" stroke-linecap="round">
          <line x1="44" y1="112" x2="70" y2="116"/>
          <line x1="41" y1="128" x2="70" y2="128"/>
          <line x1="46" y1="144" x2="72" y2="139"/>
          <line x1="156" y1="112" x2="130" y2="116"/>
          <line x1="159" y1="128" x2="130" y2="128"/>
          <line x1="154" y1="144" x2="128" y2="139"/>
        </g>
      </svg>
    </div>
    <h1>韩立的后宫 🎀</h1>
    <p class="tagline">欢迎来到我的小天地</p>
  </header>
  <section>
    <div class="card">
      <h2>🎵 每日推荐</h2>
      <div class="music-player">
        <div class="music-controls">
          <button class="music-btn" onclick="prevSong()">⏮</button>
          <button class="music-btn" id="playBtn" onclick="toggleMusic()">▶</button>
          <button class="music-btn" onclick="nextSong()">⏭</button>
        </div>
        <div class="music-info">
          <div class="title" id="songTitle">准备就绪</div>
          <div class="artist" id="songArtist">点击播放按钮</div>
        </div>
      </div>
      <select class="music-select" id="musicSelect" onchange="selectSong(this.value)"></select>
      <div class="song-list" id="songList"></div>
      <audio id="bgMusic" loop></audio>
    </div>
  </section>
</div>
<script>
function createSakura() {
  const sakura = document.createElement('div');
  sakura.className = 'sakura';
  const size = Math.random() * 10 + 8;
  sakura.style.width = size + 'px';
  sakura.style.height = size + 'px';
  sakura.style.left = Math.random() * 100 + 'vw';
  sakura.style.animationDuration = (Math.random() * 5 + 5) + 's';
  sakura.style.opacity = Math.random() * 0.5 + 0.3;
  document.body.appendChild(sakura);
  setTimeout(() => { sakura.remove(); }, 10000);
}
setInterval(createSakura, 300);

/* ================= 歌单 =================
   前三首是你原有的。
   下面周杰伦的歌，url 是【占位地址】，格式和你原来的前缀一致。
   你需要把对应的 mp3 文件传到网站根目录，文件名要和 url 里的名字一模一样，
   否则点了会播放失败。如果不想自己传，就把真实链接发我，我直接替换。
   ======================================= */
const playlist = [
  { title: "我的音乐 1", artist: "未知", url: "https://hanli520.github.io/5_6334776616400460370.mp3" },
  { title: "我的音乐 2", artist: "未知", url: "https://hanli520.github.io/5_6073492341077837047.mp3" },
  { title: "我的音乐 3", artist: "未知", url: "https://hanli520.github.io/5_6316300105179734366.mp3" },
  { title: "晴天", artist: "周杰伦", url: "qingtian.mp3" },
  { title: "七里香", artist: "周杰伦", url: "qilixiang.mp3" },
  { title: "稻香", artist: "周杰伦", url: "daoxiang.mp3" },
  { title: "夜曲", artist: "周杰伦", url: "yequ.mp3" }
];

let currentSongIndex = 0;
const bgMusic = document.getElementById('bgMusic');
const playBtn = document.getElementById('playBtn');
const songTitle = document.getElementById('songTitle');
const songArtist = document.getElementById('songArtist');
const musicSelect = document.getElementById('musicSelect');
const songListEl = document.getElementById('songList');
let isPlaying = false;

function initMusicPlayer() {
  musicSelect.innerHTML = '';
  songListEl.innerHTML = '';
  playlist.forEach((song, index) => {
    const option = document.createElement('option');
    option.value = index;
    option.text = song.title + ' - ' + song.artist;
    musicSelect.appendChild(option);

    const item = document.createElement('div');
    item.className = 'song-item';
    item.dataset.index = index;
    item.innerHTML = '<span class="idx">' + (index + 1) + '</span>' +
                     '<span class="nm">' + song.title + '</span>' +
                     '<span class="idx">' + song.artist + '</span>';
    item.onclick = () => selectSong(index);
    songListEl.appendChild(item);
  });
  loadSong(0);
}

function refreshList() {
  document.querySelectorAll('.song-item').forEach(el => {
    el.classList.toggle('playing', Number(el.dataset.index) === currentSongIndex);
  });
}

function loadSong(index) {
  currentSongIndex = index;
  const song = playlist[index];
  bgMusic.src = song.url;
  songTitle.innerText = song.title;
  songArtist.innerText = song.artist;
  musicSelect.value = index;
  isPlaying = false;
  playBtn.innerHTML = '▶';
  refreshList();
}

function playCurrent() {
  bgMusic.play().then(() => {
    playBtn.innerHTML = '⏸';
    isPlaying = true;
    refreshList();
  }).catch(e => {
    alert('播放失败：请确认这首歌的 mp3 文件已上传，链接可访问');
    playBtn.innerHTML = '▶';
    isPlaying = false;
  });
}

function toggleMusic() {
  if (!bgMusic.src) return;
  if (isPlaying) {
    bgMusic.pause();
    playBtn.innerHTML = '▶';
    isPlaying = false;
  } else {
    playCurrent();
  }
}

function nextSong() {
  loadSong((currentSongIndex + 1) % playlist.length);
  playCurrent();
}

function prevSong() {
  loadSong((currentSongIndex - 1 + playlist.length) % playlist.length);
  playCurrent();
}

function selectSong(index) {
  const i = parseInt(index, 10);
  if (i === currentSongIndex && isPlaying) {
    bgMusic.pause();
    playBtn.innerHTML = '▶';
    isPlaying = false;
    return;
  }
  loadSong(i);
  playCurrent();
}

bgMusic.addEventListener('ended', () => {
  playBtn.innerHTML = '▶';
  isPlaying = false;
});

window.onload = function() {
  initMusicPlayer();
};
</script>
</body>
</html>
