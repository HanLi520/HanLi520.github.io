<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf2ff">
<title>韩立的音乐库</title>
<style>
:root {
  --ink: #17243b;
  --muted: #7e8da7;
  --glass: rgba(255,255,255,.54);
  --line: rgba(255,255,255,.72);
}
* { box-sizing: border-box; }
html, body { margin:0; min-height:100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--ink);
  background:
    radial-gradient(ellipse at 15% 8%, rgba(255,255,255,.98), transparent 34%),
    radial-gradient(ellipse at 88% 22%, rgba(182,215,255,.8), transparent 36%),
    radial-gradient(ellipse at 25% 80%, rgba(219,224,255,.78), transparent 35%),
    linear-gradient(145deg,#e9f2ff,#dcecff 55%,#f4f3ff);
  background-attachment: fixed;
  padding: max(30px, env(safe-area-inset-top)) 16px calc(132px + env(safe-area-inset-bottom));
}
body::before {
  content:""; position:fixed; inset:0; pointer-events:none; z-index:-1;
  background: linear-gradient(120deg,rgba(255,255,255,.16),transparent 50%,rgba(255,255,255,.18));
}
.app { width:min(100%,720px); margin:0 auto; }
h1 {
  text-align:center; margin: 22px 0 42px; font-size:clamp(30px,7vw,42px);
  font-weight:800; letter-spacing:.045em; color:#152641;
  text-shadow:0 2px 18px rgba(255,255,255,.6);
}
.section-title {
  margin:0 0 15px; font-size:22px; font-weight:750; display:flex; align-items:center; gap:10px;
}
.section-title::before { content:""; width:5px; height:24px; border-radius:8px; background:#88aee8; }
.song-list { display:flex; flex-direction:column; gap:10px; }
.song-row {
  display:flex; align-items:center; gap:14px; min-height:76px; padding:11px 14px;
  border:1px solid rgba(255,255,255,.72); border-radius:24px;
  background:rgba(255,255,255,.43); box-shadow:inset 0 1px 1px rgba(255,255,255,.75),0 8px 22px rgba(115,148,196,.06);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
}
.song-row.active { background:rgba(255,255,255,.72); border-color:rgba(255,255,255,.95); }
.song-duck { width:48px; height:48px; flex:0 0 48px; border-radius:50%; object-fit:cover; background:#fff; padding:2px; }
.song-meta { min-width:0; flex:1; }
.song-title { font-size:17px; font-weight:650; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.song-artist { margin-top:4px; color:var(--muted); font-size:13px; }
.song-play {
  flex:0 0 38px; width:38px; height:38px; border:1px solid rgba(255,255,255,.9); border-radius:50%;
  background:rgba(255,255,255,.6); color:#30435f; font-size:16px; cursor:pointer;
  box-shadow:0 3px 10px rgba(100,128,170,.08);
}
/* iOS-style bottom floating console */
.player {
  position:fixed; z-index:20; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom));
  max-width:760px; margin:0 auto; min-height:92px; padding:12px 15px;
  display:flex; align-items:center; gap:14px;
  border:1px solid rgba(255,255,255,.85); border-radius:32px;
  background:rgba(255,255,255,.66); box-shadow:0 12px 36px rgba(73,103,157,.18), inset 0 1px 1px white;
  backdrop-filter:blur(28px) saturate(1.5); -webkit-backdrop-filter:blur(28px) saturate(1.5);
}
.player-duck { width:58px;height:58px;flex:0 0 58px;border-radius:50%;object-fit:cover;background:#fff;padding:2px; }
.player-info { min-width:0; flex:1; }
.player-song-window { overflow:hidden; white-space:nowrap; font-weight:700; font-size:15px; }
.player-song-name { display:inline-block; min-width:100%; animation:marquee 11s linear infinite; }
.player-artist { color:var(--muted);font-size:12px;margin-top:5px; }
@keyframes marquee { 0%,10% { transform:translateX(0) } 90%,100% { transform:translateX(-35%) } }
 .player-controls { display:flex;align-items:center;gap:12px;flex:0 0 auto; }
.player-btn {
  width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;
  border:1.5px solid rgba(110,120,140,.28);border-radius:50%;
  background:linear-gradient(145deg,rgba(235,237,241,.82),rgba(190,197,207,.48));
  color:#202b3e;cursor:pointer;padding:0;
  box-shadow:inset 0 1px 2px rgba(255,255,255,.9),0 3px 9px rgba(55,72,102,.12);
  transition:transform .18s ease,background .18s ease,box-shadow .18s ease;
  -webkit-tap-highlight-color:transparent;
}
.player-btn:active { transform:scale(.92);box-shadow:inset 0 2px 5px rgba(70,80,100,.16); }
.player-btn.main { width:52px;height:52px;flex-basis:52px;border:1.5px solid rgba(110,120,140,.34);background:linear-gradient(145deg,rgba(225,229,235,.96),rgba(177,187,201,.68));box-shadow:inset 0 1px 3px rgba(255,255,255,.95),0 5px 14px rgba(55,72,102,.18); }
.player-btn svg { width:19px;height:19px;display:block;fill:currentColor; }
.player-btn.main svg { width:21px;height:21px; }
@media (hover:hover) { .player-btn:hover { background:linear-gradient(145deg,rgba(245,247,250,.96),rgba(190,199,211,.72)); } }
/* centered announcement popup */
.modal-backdrop {
  position:fixed; inset:0; z-index:1000; display:flex; align-items:center; justify-content:center;
  padding:22px; background:rgba(7,13,25,.70);
  backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px);
  opacity:1; visibility:visible; transition:opacity .45s ease, visibility .45s ease;
}
.modal-backdrop:not(.hidden):not(.is-closing) { animation:backdropFadeIn .65s ease both; }
.modal-backdrop.is-closing { opacity:0; pointer-events:none; }
.modal-backdrop.hidden { opacity:0; visibility:hidden; pointer-events:none; }
.announcement {
  position:relative; width:min(100%,520px); padding:clamp(18px,5vw,30px);
  border-radius:30px; border:1px solid rgba(255,255,255,.75);
  background:linear-gradient(135deg,rgba(255,255,255,.75),rgba(223,234,255,.52));
  box-shadow:0 24px 80px rgba(0,0,0,.32),inset 0 1px 1px rgba(255,255,255,.95);
  backdrop-filter:blur(32px) saturate(1.45); -webkit-backdrop-filter:blur(32px) saturate(1.45);
  transform:translateY(0) scale(1); transition:transform .45s cubic-bezier(.2,.8,.2,1);
}
.modal-backdrop:not(.hidden):not(.is-closing) .announcement { animation:modalPopIn .72s cubic-bezier(.16,1,.3,1) both; }
.modal-backdrop.is-closing .announcement { opacity:0; transform:translateY(14px) scale(.94); transition:opacity .38s ease, transform .42s cubic-bezier(.2,.8,.2,1); }
@keyframes backdropFadeIn {
  from { opacity:0; backdrop-filter:blur(0); -webkit-backdrop-filter:blur(0); }
  to { opacity:1; backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px); }
}
@keyframes modalPopIn {
  0% { opacity:0; transform:translateY(28px) scale(.90); }
  65% { opacity:1; transform:translateY(-3px) scale(1.015); }
  100% { opacity:1; transform:translateY(0) scale(1); }
}
@media (prefers-reduced-motion: reduce) {
  .modal-backdrop:not(.hidden):not(.is-closing), .modal-backdrop:not(.hidden):not(.is-closing) .announcement { animation:none; }
  .modal-backdrop, .announcement { transition:none; }
}
.hidden .announcement { transform:translateY(8px) scale(.97); }
.announcement-img { display:block;width:100%;height:auto;max-height:62vh;object-fit:contain;border-radius:18px; }
body.modal-open { overflow:hidden; }
@media(max-width:420px) {
  body { padding-left:12px;padding-right:12px; }
  h1 { margin-top:12px;margin-bottom:42px; }
  .song-row { min-height:70px;padding:9px 11px;gap:11px; }
  .song-duck { width:44px;height:44px;flex-basis:44px; }
  .player { left:8px;right:8px;gap:10px;padding:10px 11px;min-height:82px;border-radius:28px; }
  .player-duck { width:48px;height:48px;flex-basis:48px; }
  .player-controls { gap:7px; }
  .player-btn { width:36px;height:36px;flex-basis:36px; }
  .player-btn.main { width:44px;height:44px;flex-basis:44px; }
  .announcement { padding:16px;border-radius:25px; }
}
</style>
</head>

  </section>

    row.querySelector(".song-title").textContent = song.title;
    row.querySelector(".song-artist").textContent = song.artist;
    row.querySelector(".song-play").addEventListener("click", () => {

    songList.appendChild(row);
  });

function updateActiveRows() {
  [...songList.querySelectorAll(".song-row")].forEach((row, index) => {
    const active = index === currentIndex;
    row.classList.toggle("active", active);
    row.querySelector(".song-play").textContent = active && !audio.paused ? "Ⅱ" : "▶";
  });
}

function selectSong(index, shouldPlay) {
  currentIndex = (index + playlist.length) % playlist.length;
  const song = playlist[currentIndex];
  audio.src = song.url;
  playerSongName.textContent = song.title;
  playerArtist.textContent = song.artist;
  updateActiveRows();
  if (shouldPlay) playMusic();
}

function updatePlayButton(isPlaying = !audio.paused) {
  playBtn.innerHTML = isPlaying
    ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 5h5v14h-5zM13.5 5h5v14h-5z"/></svg>'
    : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.8a1 1 0 0 1 1.52-.85l11 7.2a1 1 0 0 1 0 1.7l-11 7.2A1 1 0 0 1 7 19.2z"/></svg>';
  playBtn.setAttribute("aria-label", isPlaying ? "暂停音乐" : "播放音乐");
}

function playMusic() {
  audio.play().then(() => {
    updatePlayButton(true);
    updateActiveRows();
  }).catch(() => {
    updatePlayButton(false);
    updateActiveRows();
  });
}

function toggleMusic() {
  if (audio.paused) playMusic();
  else audio.pause();
}

function nextSong() { selectSong(currentIndex + 1, true); }
function prevSong() { selectSong(currentIndex - 1, true); }

playBtn.addEventListener("click", toggleMusic);
document.getElementById("nextBtn").addEventListener("click", nextSong);
document.getElementById("prevBtn").addEventListener("click", prevSong);
audio.addEventListener("play", () => { updatePlayButton(true); updateActiveRows(); });
audio.addEventListener("pause", () => { updatePlayButton(false); updateActiveRows(); });
// 当前歌曲播放结束后，自动切换并开始播放下一首。
// 使用 onended 明确绑定，避免结束事件监听器在其他修改中重复或遗漏。
audio.onended = () => {
  if (!playlist.length) return;
  nextSong();
};

const modal = document.getElementById("announcementModal");
let modalClosing = false;
function closeAnnouncement() {
  if (modalClosing || modal.classList.contains("hidden")) return;
  modalClosing = true;
  // 先播放淡出、缩小和背景变亮动画，再彻底隐藏弹窗。
  modal.classList.add("is-closing");
  window.setTimeout(() => {
    modal.classList.add("hidden");
    modal.classList.remove("is-closing");
    document.body.classList.remove("modal-open");
    modalClosing = false;
  }, 460);
}
// 点击弹窗卡片外的暗色遮罩区域关闭；卡片和图片内部点击不关闭。
// 通过卡片的实际屏幕矩形判断点击位置，不依赖 event.target 是否恰好为遮罩层，
// 这样也能兼容部分网站预览器/移动端对点击目标的包装行为。
function isOutsideAnnouncement(event) {
  const card = modal.querySelector(".announcement");
  if (!card || modal.classList.contains("hidden") || modal.classList.contains("is-closing")) return false;

  // 只处理发生在弹窗遮罩范围内的事件，避免误伤页面其他区域。
  const path = typeof event.composedPath === "function" ? event.composedPath() : [];
  if (!path.includes(modal) && !modal.contains(event.target)) return false;

  const rect = card.getBoundingClientRect();
  const x = event.clientX;
  const y = event.clientY;
  return x < rect.left || x > rect.right || y < rect.top || y > rect.bottom;
}

function handleAnnouncementOutside(event) {
  if (isOutsideAnnouncement(event)) closeAnnouncement();
}

// pointerdown 优先响应触屏/鼠标；click 作为兼容回退。关闭函数有防重入保护。
document.addEventListener("pointerdown", handleAnnouncementOutside, true);
document.addEventListener("click", handleAnnouncementOutside, true);
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") closeAnnouncement();
});

renderSongs();
selectSong(0, false);
updatePlayButton(false);
// 尝试自动播放第一首；浏览器可能要求用户先点播放按钮。
playMusic();
</script>
