
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#eef2f5">
<title>引导页</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  background: #eef2f5;
  color: #d71920;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 112px 18px 24px;
}

.page-card {
  width: min(100%, 680px);
  background: white;
  border-radius: 4px;
  padding: clamp(28px, 7vw, 72px)
           clamp(24px, 10vw, 72px);
  box-shadow: 0 1px 3px #0002;
  text-align: center;
}

.banner {
  display: block;
  width: 100%;
  height: auto;
  margin: auto;
}

.divider {
  height: 2px;
  width: 72%;
  margin: 42px auto;
  background: #eee;
}

.values {
  margin: 0;
  color: #d71920;
  font-size: clamp(22px, 5.2vw, 42px);
  font-weight: 800;
  line-height: 1.75;
  text-align: left;
  display: inline-block;
  max-width: 100%;
}

.button-row {
  display: flex;
  justify-content: center;
  margin-top: 52px;
}

.enter-button {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  min-width: 220px;
  min-height: 62px;
  padding: 16px 34px;
  border: 0;
  border-radius: 999px;
  background: #cf2436;
  color: white;
  font-size: 19px;
  font-weight: 700;
  text-decoration: none;
}

.enter-button:active {
  background: #b91d2d;
}

/* 右上角悬浮音乐控制器 */
.music-float {
  position: fixed;
  top: 8px;
  right: 8px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}

.float-controls {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 5px;
  background: #fffffff2;
  border: 1px solid #0002;
  border-radius: 999px;
  box-shadow: 0 4px 14px #0002;
}

.float-skip {
  width: 27px;
  height: 38px;
  border: 0;
  background: transparent;
  color: #222;
  font-size: 25px;
  cursor: pointer;
}

.duck-ball {
  position: relative;
  width: 58px;
  height: 58px;
  padding: 0;
  border: 2px solid #222;
  border-radius: 50%;
  overflow: hidden;
  background: white;
  cursor: pointer;
  flex-shrink: 0;
}

.duck-ball img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}

.pause-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #ffffff55;
  color: #111;
  font-size: 20px;
  font-weight: bold;
  text-shadow: 0 1px 2px white;
}

.playlist-toggle {
  width: 42px;
  height: 27px;
  border: 1px solid #0002;
  border-radius: 0 0 14px 14px;
  background: #fffffff2;
  color: #222;
  font-size: 20px;
  cursor: pointer;
}

.playlist-panel {
  display: none;
  position: fixed;
  top: 100px;
  right: 8px;
  z-index: 10000;
  width: min(280px, calc(100vw - 24px));
  max-height: 45vh;
  overflow-y: auto;
  padding: 10px;
  background: white;
  color: #333;
  border-radius: 14px;
  box-shadow: 0 8px 28px #0003;
}

.playlist-panel.open {
  display: block;
}

.playlist-heading {
  padding: 8px;
  border-bottom: 1px solid #eee;
  font-size: 15px;
  font-weight: bold;
}

.float-song {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 11px 8px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  text-align: left;
  color: #333;
  font-size: 13px;
  cursor: pointer;
}

.float-song.active {
  background: #fff0f0;
  color: #d71920;
  font-weight: bold;
}

.song-number {
  width: 20px;
  flex-shrink: 0;
}

.song-name {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

@media (max-width: 420px) {
  body {
    padding-top: 104px;
  }

  .page-card {
    padding-left: 20px;
    padding-right: 20px;
  }

  .music-float {
    top: 6px;
    right: 6px;
  }

  .duck-ball {
    width: 54px;
    height: 54px;
  }

  .playlist-panel {
    top: 94px;
    right: 6px;
  }

  .enter-button {
    min-width: 190px;
    min-height: 56px;
    font-size: 17px;
  }
}
</style>
</head>

<body>

<!-- 主页面 -->
<main class="page-card">

  <img
    class="banner"
    src="banner.jpg"
    alt="不忘初心 牢记使命"
  >

  <div class="divider"></div>

  <p class="values">
    社会主义核心价值观<br>
    富强、民主、文明、和谐<br>
    自由、平等、公正、法治<br>
    爱国、敬业、诚信、友善
  </p>

  <div class="button-row">
    <a class="enter-button" id="enterButton" href="#">
      点我进入网站
    </a>
  </div>

</main>

<!-- 悬浮音乐球 -->
<div class="music-float">

  <div class="float-controls">

    <button
      class="float-skip"
      id="prevSongBtn"
      aria-label="上一首"
    >‹</button>

    <button
      class="duck-ball"
      id="duckPlayBtn"
      aria-label="播放或暂停"
    >
      <img src="7299.jpg" alt="鸭子音乐图标">
      <span class="pause-overlay" id="playGlyph">▶</span>
    </button>

    <button
      class="float-skip"
      id="nextSongBtn"
      aria-label="下一首"
    >›</button>

  </div>

  <button
    class="playlist-toggle"
    id="playlistToggle"
    aria-label="展开歌曲列表"
  >⌄</button>

</div>

<!-- 歌曲列表 -->
<div class="playlist-panel" id="playlistPanel">
  <div class="playlist-heading">全部歌曲</div>
  <div id="floatingSongList"></div>
</div>

<audio id="floatingAudio" preload="auto"></audio>

<script>
/* ==========================
   1. 配置主页面跳转网址
   暂时留空，之后填写真实网址
========================== */

const targetWebsite = "";

document.getElementById("enterButton")
  .addEventListener("click", function(event) {
    if (!targetWebsite) {
      event.preventDefault();
      alert("网站链接还没添加。");
      return;
    }

    this.href = targetWebsite;
  });


/* ==========================
   2. 歌曲列表
   将 url 改成你自己的 MP3 文件名
========================== */

const playlist = [
  {
    title: "我的音乐 1",
    artist: "未知",
    url: "5_6334776616400460370.mp3"
  },
  {
    title: "我的音乐 2",
    artist: "未知",
    url: "5_6073492341077837047.mp3"
  },
  {
    title: "我的音乐 3",
    artist: "未知",
    url: "5_6316300105179734366.mp3"
  },
  {
    title: "晴天",
    artist: "周杰伦",
    url: "qingtian.mp3"
  },
  {
    title: "七里香",
    artist: "周杰伦",
    url: "qilixiang.mp3"
  },
  {
    title: "稻香",
    artist: "周杰伦",
    url: "daoxiang.mp3"
  },
  {
    title: "夜曲",
    artist: "周杰伦",
    url: "yequ.mp3"
  }
];


/* ==========================
   3. 音乐播放器逻辑
========================== */

const audio = document.getElementById("floatingAudio");
const playGlyph = document.getElementById("playGlyph");
const songList = document.getElementById("floatingSongList");
const playlistPanel = document.getElementById("playlistPanel");

let currentSongIndex = 0;

function renderPlaylist() {
  songList.innerHTML = "";

  playlist.forEach((song, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "float-song";

    const number = document.createElement("span");
    number.className = "song-number";
    number.textContent = index + 1;

    const name = document.createElement("span");
    name.className = "song-name";
    name.textContent = song.title + " · " + song.artist;

    button.append(number, name);

    button.addEventListener("click", () => {
      loadSong(index);
      playSong();
    });

    songList.appendChild(button);
  });

  updatePlaylist();
}

function updatePlaylist() {
  document.querySelectorAll(".float-song")
    .forEach((button, index) => {
      button.classList.toggle(
        "active",
        index === currentSongIndex
      );
    });
}

function loadSong(index) {
  currentSongIndex =
    (index + playlist.length) % playlist.length;

  audio.src = playlist[currentSongIndex].url;
  audio.load();

  playGlyph.textContent = "▶";
  updatePlaylist();
}

function playSong() {
  audio.play().catch(() => {
    playGlyph.textContent = "▶";
  });
}

function toggleMusic() {
  if (audio.paused) {
    playSong();
  } else {
    audio.pause();
  }
}

function nextSong() {
  loadSong(currentSongIndex + 1);
  playSong();
}

function prevSong() {
  loadSong(currentSongIndex - 1);
  playSong();
}


/* 按钮事件 */

document.getElementById("duckPlayBtn")
  .addEventListener("click", toggleMusic);

document.getElementById("prevSongBtn")
  .addEventListener("click", prevSong);

document.getElementById("nextSongBtn")
  .addEventListener("click", nextSong);

document.getElementById("playlistToggle")
  .addEventListener("click", () => {
    playlistPanel.classList.toggle("open");
  });


/* 播放状态同步 */

audio.addEventListener("play", () => {
  playGlyph.textContent = "Ⅱ";
});

audio.addEventListener("pause", () => {
  playGlyph.textContent = "▶";
});

audio.addEventListener("ended", nextSong);


/* 初始化：默认选择第一首 */

renderPlaylist();
loadSong(0);

/* 尝试自动播放。
   浏览器若阻止自动播放，点中间鸭子即可。 */
playSong();

</script>
</body>
</html>
