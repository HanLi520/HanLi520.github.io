<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>韩立的后宫 🎀 | 姚蔓.xyz</title>
<style>
  :root{
    --bg:#1a0b14; --card:#2d1823; --pink:#ff69b4; --pink2:#ff9ecb;
    --deep:#d63384; --text:#ffe0ef; --muted:#b06a8f; --line:#4a2c3d;
    --glass:rgba(255, 105, 180, 0.1); --glass-border:rgba(255, 105, 180, 0.3);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.7;
    background-image:radial-gradient(circle at 15% 20%, #3a1525 0, transparent 40%),
                     radial-gradient(circle at 85% 80%, #2a1020 0, transparent 40%);
    min-height: 100vh; overflow-x: hidden;
  }
  
  /* 樱花特效 */
  .sakura {
    position: fixed; top: -10px; z-index: 0; pointer-events: none;
    background: #ffb7c5; border-radius: 50% 0 50% 50%;
    animation: fall linear forwards;
  }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
  }

  .page { display: none; position: relative; z-index: 1; animation: fadeIn 0.4s ease; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

  header { text-align: center; padding: 40px 20px 20px; }
  .avatar-box {
    width: 100px; height: 100px; margin: 0 auto 15px;
    border-radius: 50%; overflow: hidden; border: 3px solid var(--pink);
    box-shadow: 0 0 20px rgba(255,105,180,0.4);
  }
  .avatar-box svg { width: 100%; height: 100%; }
  h1 { font-size: 26px; color: var(--pink); margin-bottom: 5px; }
  .tagline { color: var(--muted); font-size: 14px; }

  section { max-width: 600px; margin: 0 auto; padding: 15px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 18px; margin-bottom: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  }
  .card h2 { font-size: 18px; color: var(--pink); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }

  /* 音乐播放器 */
  .music-player { display: flex; align-items: center; gap: 15px; background: rgba(255,105,180,0.1); padding: 12px; border-radius: 15px; border: 1px solid var(--glass-border); }
  .music-player audio { display: none; }
  .play-btn {
    width: 45px; height: 45px; border-radius: 50%; background: var(--pink); border: none;
    color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; box-shadow: 0 4px 12px rgba(255,105,180,0.4);
  }
  .music-info { flex: 1; overflow: hidden; }
  .music-info .title { font-size: 14px; font-weight: bold; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .music-info .artist { font-size: 12px; color: var(--muted); }

  /* 相册 */
  .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .gallery div {
    aspect-ratio: 1/1; background: var(--glass); border-radius: 12px;
    display: flex; align-items: center; justify-content: center; font-size: 40px;
    border: 1px solid var(--glass-border); transition: 0.2s; cursor: pointer;
  }
  .gallery div:active { transform: scale(0.95); }

  /* 游戏 */
  .game-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-width: 340px; margin: 0 auto; }
  .memory-card {
    aspect-ratio: 1/1; background: var(--glass); border-radius: 12px;
    display: flex; align-items: center; justify-content: center; font-size: 28px;
    border: 1px solid var(--glass-border); cursor: pointer;
    transition: transform 0.3s, background 0.3s; transform-style: preserve-3d;
  }
  .memory-card.flipped { background: var(--pink); transform: rotateY(180deg); }
  .memory-card.matched { background: rgba(255,105,180,0.4); border-color: var(--pink); }
  .game-controls { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
  .restart-btn {
    padding: 8px 16px; border-radius: 99px; background: var(--pink); color: #fff;
    border: none; font-size: 13px; cursor: pointer; font-weight: bold;
  }

  /* 底栏 */
  .tab-bar {
    position: fixed; bottom: 0; left: 0; width: 100%; height: 60px;
    background: rgba(26, 11, 20, 0.95); backdrop-filter: blur(10px);
    border-top: 1px solid var(--line); display: flex; justify-content: space-around;
    align-items: center; z-index: 999;
  }
  .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; cursor: pointer; }
  .tab-item.active { color: var(--pink); font-weight: bold; }
  .tab-item .icon { font-size: 20px; margin-bottom: 2px; }
</style>
</head>
<body>

<!-- 个人主页 -->
<div id="page-home" class="page active">
  <header>
    <div class="avatar-box">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <rect width="200" height="200" fill="#1a1a1a"/>
        <circle cx="55" cy="55" r="28" fill="#8d5524"/><circle cx="55" cy="55" r="15" fill="#c68642"/>
        <circle cx="145" cy="55" r="28" fill="#8d5524"/><circle cx="145" cy="55" r="15" fill="#c68642"/>
        <ellipse cx="100" cy="105" rx="65" ry="60" fill="#8d5524"/>
        <ellipse cx="100" cy="120" rx="45" ry="35" fill="#f1c27d"/>
        <line x1="60" y1="80" x2="85" y2="88" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
        <line x1="140" y1="80" x2="115" y2="88" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
        <circle cx="75" cy="95" r="8" fill="#1a1a1a"/><circle cx="125" cy="95" r="8" fill="#1a1a1a"/>
        <circle cx="78" cy="92" r="3" fill="#fff"/><circle cx="128" cy="92" r="3" fill="#fff"/>
        <ellipse cx="100" cy="112" rx="14" ry="10" fill="#1a1a1a"/>
        <path d="M 85,130 Q 100,145 115,130" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
        <path d="M 40,165 Q 100,195 160,165 L 160,200 L 40,200 Z" fill="#d32f2f"/>
        <path d="M 80,165 L 100,175 L 120,165" fill="none" stroke="#fff" stroke-width="2" opacity="0.5"/>
      </svg>
    </div>
    <h1>韩立的后宫 🎀</h1>
    <p class="tagline">欢迎来到我的小天地</p>
  </header>
  <section>
    <div class="card">
      <h2>🎵 每日推荐</h2>
      <div class="music-player">
        <button class="play-btn" id="playBtn" onclick="toggleMusic()">▶</button>
        <div class="music-info">
          <div class="title">粉色回忆 (点击播放)</div>
          <div class="artist">韩立的后宫专属BGM</div>
        </div>
        <audio id="bgMusic" loop>
          <!-- 这里可以替换成你自己的音乐链接 -->
          <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
        </audio>
      </div>
    </div>
    <div class="card">
      <h2>📸 我的相册</h2>
      <div class="gallery">
        <div>🌸</div><div>🐻</div><div>🎀</div>
        <div>🍭</div><div>🌈</div><div>🍿</div>
      </div>
    </div>
  </section>
</div>

<!-- 小游戏 -->
<div id="page-game" class="page">
  <header>
    <h1>🧠 记忆翻牌</h1>
    <p class="tagline">找出相同的图案吧！</p>
  </header>
  <section>
    <div class="card">
      <div class="game-controls">
        <span>步数: <b id="moveCount">0</b></span>
        <button class="restart-btn" onclick="initGame()">重新开始</button>
      </div>
      <div class="game-board" id="gameBoard"></div>
    </div>
  </section>
</div>

<!-- 底栏 -->
<div class="tab-bar">
  <div class="tab-item active" data-page="home" onclick="switchTab('home', this)">
    <span class="icon">🏠</span><span>主页</span>
  </div>
  <div class="tab-item" data-page="game" onclick="switchTab('game', this)">
    <span class="icon">🎮</span><span>游戏</span>
  </div>
</div>
<script>
// ================== 1. 页面切换 ==================
function switchTab(pageName, element) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + pageName).classList.add('active');
  document.querySelectorAll('.tab-item').forEach(item => item.classList.remove('active'));
  if (element) element.classList.add('active');
}

// ================== 2. 樱花飘落特效 ==================
function createSakura() {
  const sakura = document.createElement('div');
  sakura.className = 'sakura';
  const size = Math.random() * 10 + 8;
  sakura.style.width = size + 'px';
  sakura.style.height = size + 'px';
  sakura.style.left = Math.random() * 100 + 'vw';
  sakura.style.animationDuration = (Math.random() * 5 + 5) + 's';
  sakura.style.opacity = Math.random() * 0.5 + 0.3;
  document.body.appendChild(sakura);
  setTimeout(() => { sakura.remove(); }, 10000);
}
setInterval(createSakura, 300); // 每300毫秒飘落一朵

// ================== 3. 音乐播放器 ==================
const bgMusic = document.getElementById('bgMusic');
const playBtn = document.getElementById('playBtn');
let isPlaying = false;

function toggleMusic() {
  if (isPlaying) {
    bgMusic.pause(); playBtn.innerHTML = '▶';
  } else {
    bgMusic.play().catch(e => alert('音乐加载失败，可能是网络问题，不影响其他功能哦～'));
    playBtn.innerHTML = '⏸';
  }
  isPlaying = !isPlaying;
}

// ================== 4. 记忆翻牌游戏 ==================
const emojis = ['🎀', '🐻', '🍬', '⭐️', '🍭', '🍿', '🍦', '🎈'];
let cards = [];
let flippedCards = [];
let matchedPairs = 0;
let moves = 0;
let lockBoard = false;

function initGame() {
  const board = document.getElementById('gameBoard');
  board.innerHTML = '';
  cards = [...emojis, ...emojis].sort(() => Math.random() - 0.5); // 打乱
  flippedCards = []; matchedPairs = 0; moves = 0;
  document.getElementById('moveCount').innerText = moves;
  lockBoard = false;

  cards.forEach((emoji, index) => {
    const card = document.createElement('div');
    card.className = 'memory-card';
    card.dataset.emoji = emoji;
    card.dataset.index = index;
    card.onclick = () => flipCard(card);
    board.appendChild(card);
  });
}

function flipCard(card) {
  if (lockBoard || card.classList.contains('flipped') || card.classList.contains('matched')) return;
  
  card.classList.add('flipped');
  card.innerText = card.dataset.emoji;
  flippedCards.push(card);

  if (flippedCards.length === 2) {
    moves++;
    document.getElementById('moveCount').innerText = moves;
    checkMatch();
  }
}

function checkMatch() {
  const [card1, card2] = flippedCards;
  if (card1.dataset.emoji === card2.dataset.emoji) {
    card1.classList.add('matched');
    card2.classList.add('matched');
    flippedCards = [];
    matchedPairs++;
    if (matchedPairs === emojis.length) {
      setTimeout(() => alert('🎉 恭喜你！全部配对成功！用了 ' + moves + ' 步'), 300);
    }
  } else {
    lockBoard = true;
    setTimeout(() => {
      card1.classList.remove('flipped'); card1.innerText = '';
      card2.classList.remove('flipped'); card2.innerText = '';
      flippedCards = [];
      lockBoard = false;
    }, 800);
  }
}

// 初始化游戏
initGame();
</script>
</body>
</html>
