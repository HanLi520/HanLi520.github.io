<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>韩立的后宫 🎀</title>
<script src="https://cdn.bootcdn.net/ajax/libs/supabase-js/2.45.4/supabase.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:"PingFang SC",sans-serif;background:#121212;color:#e0e0e0;height:100vh;overflow:hidden;display:flex;flex-direction:column;}
  .page{display:none;flex:1;overflow-y:auto;padding:20px 15px 80px 15px;}
  .page.active{display:block;}
  h1{color:#a855f7;font-size:24px;margin-bottom:5px;text-align:center;}
  .tagline{color:#888;font-size:13px;text-align:center;margin-bottom:20px;}
  .card{background:#1e1e1e;border:1px solid #333;border-radius:18px;padding:18px;margin-bottom:15px;}
  .sec-head h2{font-size:18px;color:#a855f7;margin-bottom:12px;}
  input[type="text"], input[type="datetime-local"], input[type="number"] {
    width:100%;padding:10px;margin-bottom:10px;border:1px solid #444;border-radius:10px;font-size:14px;outline:none;background:#2a2a2a;color:#fff;
  }
  .record-type-group{display:flex;gap:10px;margin-bottom:10px;}
  .record-type-group label{flex:1;text-align:center;padding:8px;border:1px solid #444;border-radius:10px;font-size:14px;background:#2a2a2a;color:#888;cursor:pointer;}
  .record-type-group input:checked + label {background:#a855f7;color:#fff;border-color:#a855f7;font-weight:bold;}
  .record-type-group input{display:none;}
  .btn{width:100%;padding:12px;border:none;border-radius:99px;background:linear-gradient(90deg,#d63384,#ff9ecb);color:#fff;font-size:14px;font-weight:600;cursor:pointer;}
  .summary-box{display:flex;justify-content:space-between;background:#2a2a2a;padding:15px;border-radius:12px;margin-bottom:15px;font-size:14px;font-weight:bold;}
  .summary-box span{color:#ff9ecb;}
  .record-item{display:flex;justify-content:space-between;align-items:center;background:#252525;border-radius:12px;padding:12px;margin-bottom:8px;font-size:14px;}
  .record-item .amount{font-weight:bold;margin-right:10px;}
  .record-item .amount.expense{color:#ff6b6b;}
  .record-item .amount.income{color:#51cf66;}
  .record-item .del-btn{background:none;border:none;color:#666;font-size:18px;cursor:pointer;}
  .chat-container{display:flex;flex-direction:column;height:60vh;background:#1e1e1e;border-radius:18px;overflow:hidden;border:1px solid #333;}
  .chat-messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px;}
  .msg{padding:10px 14px;border-radius:18px;font-size:14px;max-width:85%;word-break:break-word;background:#333;}
  .msg.me{align-self:flex-end;background:#a855f7;color:#fff;}
  .msg img{max-width:100%;border-radius:8px;display:block;}
  .chat-input-area{display:flex;gap:6px;padding:10px;border-top:1px solid #333;background:#1e1e1e;align-items:center;}
  .chat-input-area input[type="text"]{flex:1;margin-bottom:0;border-radius:99px;}
  .chat-icon-btn{background:none;border:none;font-size:22px;color:#888;cursor:pointer;padding:0 5px;}
  .avatar-box{width:100%;max-width:260px;margin:0 auto;border-radius:18px;overflow:hidden;border:2px solid #444;}
  .avatar-box svg{width:100%;height:100%;display:block;}
  .tab-bar{position:fixed;bottom:0;left:0;width:100%;height:56px;background:#0a0a0a;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;z-index:999;}
  .tab-item{flex:1;height:100%;display:flex;align-items:center;justify-content:center;color:#666;font-size:15px;font-weight:500;cursor:pointer;}
  .tab-item.active{color:#a855f7;font-weight:800;font-size:17px;}
</style>
</head>
<body>

<div id="page-account" class="page active">
  <h1>📝 记账本</h1>
  <p class="tagline">记录每一笔收支</p>
  <div class="card">
    <div class="sec-head"><h2>添加记录</h2></div>
    <input type="datetime-local" id="recordDate">
    <div class="record-type-group">
      <input type="radio" id="typeExpense" name="recordType" value="expense" checked onchange="updatePlaceholder()">
      <label for="typeExpense">支出</label>
      <input type="radio" id="typeIncome" name="recordType" value="income" onchange="updatePlaceholder()">
      <label for="typeIncome">收入</label>
    </div>
    <input type="text" id="recordItem" placeholder="输入用途（如：买菜）">
    <input type="number" id="recordAmount" placeholder="金额 (元)" step="0.01">
    <button class="btn" onclick="addRecord()">添加记录</button>
  </div>
  <div class="card">
    <div class="sec-head"><h2>收支统计</h2></div>
    <div class="summary-box">
      <div>总支出<br>¥<span id="totalExpense">0.00</span></div>
      <div>总收入<br>¥<span id="totalIncome">0.00</span></div>
    </div>
    <h3 style="font-size:15px;color:#888;margin-bottom:8px;">📅 按月汇总</h3>
    <div id="monthlyList"></div>
  </div>
  <div class="card">
    <div class="sec-head"><h2>收支明细</h2></div>
    <div id="recordList"></div>
  </div>
</div>

<div id="page-chat" class="page">
  <h1>💬 聊天室</h1>
  <p class="tagline">分享你的心情和图片（跨设备同步）</p>
  <div class="chat-container">
    <div class="chat-messages" id="chatMessages">
      <div class="msg">欢迎来到聊天室！发个表情或图片试试吧～ 🎀</div>
    </div>
    <div class="chat-input-area">
      <input type="text" id="chatInput" placeholder="输入..." oninput="toggleSendBtn()">
      <button class="chat-icon-btn" onclick="document.getElementById('chatImgInput').click()">+</button>
      <input type="file" id="chatImgInput" accept="image/*" hidden onchange="sendChatImage(this.files[0])">
      <button class="chat-icon-btn" id="actionBtn" onclick="handleAction()">🎤</button>
    </div>
  </div>
</div>

<div id="page-profile" class="page">
  <h1>👤 我的</h1>
  <p class="tagline">个人主页</p>
  <div class="card">
    <div class="sec-head"><h2>专属熊大头像</h2></div>
    <div class="avatar-box">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <rect width="200" height="200" fill="#1a1a1a"/>
        <circle cx="55" cy="55" r="28" fill="#8d5524"/><circle cx="55" cy="55" r="15" fill="#c68642"/>
        <circle cx="145" cy="55" r="28" fill="#8d5524"/><circle cx="145" cy="55" r="15" fill="#c68642"/>
        <ellipse cx="100" cy="105" rx="65" ry="60" fill="#8d5524"/>
        <ellipse cx="100" cy="120" rx="45" ry="35" fill="#f1c27d"/>
        <line x1="60" y1="80" x2="85" y2="88" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
        <line x1="140" y1="80" x2="115" y2="88" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
        <circle cx="75" cy="95" r="8" fill="#1a1a1a"/><circle cx="125" cy="95" r="8" fill="#1a1a1a"/>
        <circle cx="78" cy="92" r="3" fill="#fff"/><circle cx="128" cy="92" r="3" fill="#fff"/>
        <ellipse cx="100" cy="112" rx="14" ry="10" fill="#1a1a1a"/>
        <path d="M 85,130 Q 100,145 115,130" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
        <path d="M 40,165 Q 100,195 160,165 L 160,200 L 40,200 Z" fill="#d32f2f"/>
        <path d="M 80,165 L 100,175 L 120,165" fill="none" stroke="#fff" stroke-width="2" opacity="0.5"/>
      </svg>
    </div>
  </div>
</div>

<div class="tab-bar" id="tabBar">
  <div class="tab-item active" data-tab="account" onclick="switchTab('account', this)">记账</div>
  <div class="tab-item" data-tab="chat" onclick="switchTab('chat', this)">聊天</div>
  <div class="tab-item" data-tab="profile" onclick="switchTab('profile', this)">我的</div>
</div>

<script>
// ================== 核心防卡死超时机制 ==================
// 给所有网络请求加一个 5 秒超时，避免断网时网页卡死
function withTimeout(promise, ms = 5000) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error('网络超时')), ms))
  ]);
}

// ================== 1. 页面切换 ==================
window.switchTab = function(tabName, element) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + tabName).classList.add('active');
  document.querySelectorAll('.tab-item').forEach(item => item.classList.remove('active'));
  if (element) element.classList.add('active');
}

let startX = 0, endX = 0;
document.querySelector('body').addEventListener('touchstart', e => { startX = e.changedTouches[0].screenX; }, {passive: true});
document.querySelector('body').addEventListener('touchend', e => {
  endX = e.changedTouches[0].screenX;
  const tabs = ['account', 'chat', 'profile'];
  let activeIndex = tabs.findIndex(t => document.getElementById('page-' + t).classList.contains('active'));
  if (startX - endX > 60 && activeIndex < tabs.length - 1) {
    switchTab(tabs[activeIndex + 1], document.querySelectorAll('.tab-item')[activeIndex + 1]);
  } else if (endX - startX > 60 && activeIndex > 0) {
    switchTab(tabs[activeIndex - 1], document.querySelectorAll('.tab-item')[activeIndex - 1]);
  }
}, {passive: true});

// ================== 2. 初始化 Supabase ==================
let supabase = null;
try {
  const supabaseUrl = 'https://snzuhtakhmvexwangvhn.supabase.co';
  const supabaseKey = 'sb_publishable_iPEwpOxizCaU0ig0ssLGLQ_3ysepmGi'; 
  if (window.supabase) {
    supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
  }
} catch (e) { console.error("初始化失败", e); }

let myName = localStorage.getItem('myChatName') || '用户' + Math.floor(Math.random() * 1000);
localStorage.setItem('myChatName', myName);

// ================== 3. 记账功能 ==================
document.getElementById('recordDate').value = new Date(new Date().getTime() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);

window.updatePlaceholder = function() {
  document.getElementById('recordItem').placeholder = document.getElementById('typeExpense').checked ? "输入用途（如：买菜）" : "输入来源（如：工资）";
}

window.addRecord = async function() {
  if (!supabase) { alert('网络组件未加载，请刷新重试'); return; }
  const dateStr = document.getElementById('recordDate').value;
  const item = document.getElementById('recordItem').value.trim();
  const amount = parseFloat(document.getElementById('recordAmount').value);
  const type = document.querySelector('input[name="recordType"]:checked').value;
  if (!dateStr || !item || isNaN(amount) || amount <= 0) { alert('请填写完整！'); return; }
  
  const date = dateStr.replace('T', ' ').slice(0, 16);
  try {
    // 使用超时包装，防止卡死
    await withTimeout(supabase.from('records').insert([{ date, item, amount, type }]));
    alert('记账成功！');
  } catch (err) {
    alert('网络连接超时，请检查网络（切换Wi-Fi/流量）后重试');
    return;
  }
  
  document.getElementById('recordItem').value = ''; document.getElementById('recordAmount').value = '';
  window.loadRecords();
}

window.deleteRecord = async function(id) {
  if (!supabase) return;
  if (!confirm('确定删除？')) return;
  try { await withTimeout(supabase.from('records').delete().eq('id', id)); } catch(e) { alert('网络超时，删除失败'); return; }
  window.loadRecords();
}

window.loadRecords = async function() {
  if (!supabase) return;
  try {
    const { data: records, error } = await withTimeout(supabase.from('records').select('*').order('date', { ascending: false }));
    if (error) return;
    let tExp = 0, tInc = 0; const mMap = {};
    records.forEach(r => {
      if (r.type === 'expense') tExp += r.amount; else tInc += r.amount;
      const m = r.date.slice(0, 7); if (!mMap[m]) mMap[m] = { e: 0, i: 0 }; mMap[m][r.type === 'expense' ? 'e' : 'i'] += r.amount;
    });
    document.getElementById('totalExpense').innerText = tExp.toFixed(2);
    document.getElementById('totalIncome').innerText = tInc.toFixed(2);
    const mL = document.getElementById('monthlyList'); mL.innerHTML = '';
    const sortedM = Object.keys(mMap).sort().reverse();
    if (sortedM.length === 0) mL.innerHTML = '<div style="font-size:13px;color:#888;text-align:center;">暂无记录</div>';
    else sortedM.forEach(m => { mL.innerHTML += '<div style="display:flex;justify-content:space-between;font-size:13px;background:#252525;padding:8px 12px;border-radius:8px;margin-bottom:5px;"><span>' + m + '</span><span>支出 ¥' + mMap[m].e.toFixed(2) + ' / 收入 ¥' + mMap[m].i.toFixed(2) + '</span></div>'; });
    const rL = document.getElementById('recordList'); rL.innerHTML = '';
    if (records.length === 0) rL.innerHTML = '<div style="text-align:center;color:#888;font-size:13px;">还没有记录哦～</div>';
    else records.forEach(r => {
      rL.innerHTML += '<div class="record-item"><div><b>' + r.item + '</b><br><small style="color:#888;">' + r.date + '</small></div><div><span class="amount ' + r.type + '">' + (r.type === 'expense' ? '-' : '+') + '¥' + r.amount.toFixed(2) + '</span><button class="del-btn" onclick="deleteRecord(' + r.id + ')">🗑️</button></div></div>';
    });
  } catch(e) { console.warn('加载超时'); }
}

// ================== 4. 聊天功能 ==================
const chatInput = document.getElementById('chatInput');
const actionBtn = document.getElementById('actionBtn');

window.toggleSendBtn = function() {
  if (chatInput.value.trim() !== '') { actionBtn.innerHTML = '发送'; actionBtn.style.color = '#a855f7'; actionBtn.style.fontSize = '14px'; actionBtn.style.fontWeight = 'bold'; }
  else { actionBtn.innerHTML = '🎤'; actionBtn.style.color = '#888'; actionBtn.style.fontSize = '22px'; actionBtn.style.fontWeight = 'normal'; }
}

window.handleAction = function() {
  if (chatInput.value.trim() !== '') { window.sendChatText(); }
  else { alert('语音功能需要后端支持～'); }
}

window.sendChatText = async function() {
  if (!supabase) { alert('网络组件未加载，请刷新重试'); return; }
  const text = chatInput.value.trim();
  if (!text) return;
  chatInput.value = ''; window.toggleSendBtn();
  try {
    await withTimeout(supabase.from('messages').insert([{ content: text, username: myName }]));
  } catch (err) {
    alert('网络连接超时，发送失败，请检查网络');
  }
}

window.sendChatImage = function(file) {
  if (!supabase) { alert('网络组件未加载，请刷新重试'); return; }
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try { await withTimeout(supabase.from('messages').insert([{ content: '<img src="' + e.target.result + '">', username: myName }])); } catch(err) { alert('网络超时，图片发送失败'); }
  };
  reader.readAsDataURL(file);
}

window.appendMessage = function(content, isMe) {
  const div = document.createElement('div');
  div.className = 'msg ' + (isMe ? 'me' : '');
  div.innerHTML = content;
  document.getElementById('chatMessages').appendChild(div);
  document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
}

window.loadChatHistory = async function() {
  if (!supabase) return;
  try {
    const { data: msgs, error } = await withTimeout(supabase.from('messages').select('*').order('created_at', { ascending: true }));
    if (error) return;
    document.getElementById('chatMessages').innerHTML = '';
    msgs.forEach(m => { window.appendMessage(m.content, m.username === myName); });
  } catch(e) { console.warn('聊天记录加载超时'); }
}

window.subscribeToChat = function() {
  if (!supabase) return;
  try {
    supabase.channel('public:messages').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
      const m = payload.new;
      if (m.username !== myName) { window.appendMessage(m.content, false); }
    }).subscribe();
  } catch(e) { console.warn('实时监听开启失败'); }
}

// ================== 5. 键盘弹出隐藏底栏 ==================
const tabBar = document.getElementById('tabBar');
document.querySelectorAll('input').forEach(input => {
  input.addEventListener('focus', () => tabBar.style.display = 'none');
  input.addEventListener('blur', () => tabBar.style.display = 'flex');
});

// ================== 6. 初始化 ==================
window.onload = function() {
  window.loadRecords();
  window.loadChatHistory();
  window.subscribeToChat();
  window.updatePlaceholder();
}
</script>
</body>
</html>
