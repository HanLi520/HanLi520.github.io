<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>韩立的后宫 🎀 | 姚蔓.xyz</title>
<style>
  :root{
    --bg:#fff0f6; --card:#ffffff; --pink:#ff69b4; --pink2:#ff9ecb;
    --deep:#d63384; --text:#6b2d4f; --muted:#b06a8f; --line:#ffd6e8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.7;
    background-image:radial-gradient(circle at 15% 20%, #ffe0ef 0, transparent 40%),
                     radial-gradient(circle at 85% 80%, #ffe9f4 0, transparent 40%);
  }
  a{color:inherit;text-decoration:none}
  /* 导航 */
  nav{
    position:sticky; top:0; z-index:10;
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 22px; background:rgba(255,240,246,.9); backdrop-filter:blur(8px);
    border-bottom:2px dashed var(--line);
  }
  .logo{font-weight:800; font-size:18px; color:var(--deep)}
  .logo small{font-size:12px; color:var(--muted); font-weight:400; margin-left:6px}
  nav ul{display:flex; gap:6px; list-style:none}
  nav ul a{
    padding:6px 14px; border-radius:99px; font-size:14px; color:var(--muted);
    transition:.2s;
  }
  nav ul a:hover{background:var(--pink); color:#fff}
  /* 首屏 */
  header{
    text-align:center; padding:64px 20px 48px;
  }
  .cat{width:130px; margin-bottom:10px}
  h1{
    font-size:clamp(28px,5vw,44px); color:var(--deep);
  }
  h1 .bow{display:inline-block; transform:rotate(-8deg)}
  .tagline{color:var(--muted); margin-top:10px}
  .pill{
    display:inline-block; margin-top:18px; padding:8px 18px; border-radius:99px;
    background:#fff; border:2px solid var(--pink2); color:var(--deep);
    font-size:14px; box-shadow:0 4px 12px rgba(255,105,180,.18);
  }
  /* 区块 */
  section{max-width:960px; margin:0 auto; padding:40px 20px 60px}
  .sec-head{display:flex; align-items:center; gap:10px; margin-bottom:6px}
  .sec-head h2{font-size:22px; color:var(--deep)}
  .sec-desc{color:var(--muted); font-size:14px; margin-bottom:22px}
  .card{
    background:var(--card); border:2px solid var(--line); border-radius:22px;
    padding:24px; box-shadow:0 6px 18px rgba(214,51,132,.08);
  }
  /* 天气 */
  .weather-top{display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:18px}
  .weather-top input{
    flex:1; min-width:180px; padding:10px 16px; border-radius:99px;
    border:2px solid var(--line); outline:none; font-size:14px; color:var(--text);
  }
  .weather-top input:focus{border-color:var(--pink)}
  .btn{
    padding:10px 22px; border:none; border-radius:99px; cursor:pointer;
    background:linear-gradient(90deg,var(--pink),var(--pink2)); color:#fff;
    font-size:14px; font-weight:600; transition:.2s;
    box-shadow:0 4px 12px rgba(255,105,180,.3);
  }
  .btn:hover{transform:translateY(-2px)}
  .btn.small{padding:6px 14px; font-size:12px}
  .btn.ghost{background:#fff; color:var(--deep); border:2px solid var(--pink2); box-shadow:none}
  .weather-now{display:flex; align-items:center; gap:18px; flex-wrap:wrap}
  .w-icon{font-size:56px}
  .w-temp{font-size:44px; font-weight:800; color:var(--deep)}
  .w-meta{color:var(--muted); font-size:14px}
  .w-days{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; margin-top:20px}
  .w-day{
    background:var(--bg); border-radius:16px; padding:14px; text-align:center;
    border:2px solid var(--line); font-size:13px;
  }
  .w-day .d{font-weight:700; color:var(--deep)}
  .w-day .i{font-size:26px; margin:6px 0}
  /* 网盘 */
  .drop{
    border:3px dashed var(--pink2); border-radius:22px; padding:36px 20px;
    text-align:center; color:var(--muted); background:#fffafc; margin-bottom:20px;
    cursor:pointer; transition:.2s;
  }
  .drop:hover{background:#fff3f9}
  .drop .big{font-size:38px}
  .file-list{display:flex; flex-direction:column; gap:10px}
  .file-item{
    display:flex; align-items:center; gap:12px; background:var(--bg);
    border:2px solid var(--line); border-radius:14px; padding:12px 16px; font-size:14px;
  }
  .file-item .fi{font-size:22px}
  .file-item .fn{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .file-item .fs{color:var(--muted); font-size:12px; white-space:nowrap}
  video{width:100%; max-width:320px; border-radius:12px; margin-top:8px}
  .empty{color:var(--muted); text-align:center; padding:18px; font-size:14px}
  /* 页脚 */
  footer{
    text-align:center; padding:28px 16px; color:var(--muted); font-size:13px;
    border-top:2px dashed var(--line);
  }
  @media (max-width:600px){ nav ul a{padding:6px 8px; font-size:13px} }
</style>
</head>
<body>

<nav>
  <div class="logo">🎀 韩立的后宫 <small>姚蔓.xyz</small></div>
  <ul>
    <li><a href="#home">首页</a></li>
    <li><a href="#weather">天气</a></li>
    <li><a href="#files">文件</a></li>
    <li><a href="#videos">视频</a></li>
  </ul>
</nav>

<header id="home">
  <!-- 可爱的蝴蝶结小猫 -->
  <svg class="cat" viewBox="0 0 120 110" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="60" cy="66" rx="42" ry="38" fill="#fff" stroke="#ffb7d5" stroke-width="3"/>
    <circle cx="32" cy="36" r="14" fill="#fff" stroke="#ffb7d5" stroke-width="3"/>
    <circle cx="88" cy="36" r="14" fill="#fff" stroke="#ffb7d5" stroke-width="3"/>
    <circle cx="60" cy="30" r="22" fill="#fff" stroke="#ffb7d5" stroke-width="3"/>
    <circle cx="52" cy="28" r="3" fill="#6b2d4f"/>
    <circle cx="68" cy="28" r="3" fill="#6b2d4f"/>
    <ellipse cx="60" cy="36" rx="4" ry="3" fill="#ff9ecb"/>
    <path d="M60 39 q-4 5 -9 4 M60 39 q4 5 9 4" stroke="#6b2d4f" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <circle cx="42" cy="38" r="4" fill="#ffd6e8"/>
    <circle cx="78" cy="38" r="4" fill="#ffd6e8"/>
    <circle cx="24" cy="22" r="7" fill="#ff69b4"/>
    <circle cx="38" cy="22" r="7" fill="#ff69b4"/>
    <circle cx="31" cy="22" r="3.5" fill="#d63384"/>
  </svg>
  <h1>韩立的后宫 <span class="bow">🎀</span></h1>
  <p class="tagline">一个粉粉嫩嫩的小天地 · 天气 · 文件 · 视频</p>
  <div class="pill">💖 欢迎回家，主人～</div>
</header>

<section id="weather">
  <div class="sec-head"><h2>🌤️ 今日天气</h2></div>
  <p class="sec-desc">输入城市名，实时查看天气和未来几天预报～</p>
  <div class="card">
    <div class="weather-top">
      <input id="cityInput" type="text" placeholder="输入城市，比如：北京、上海、杭州" value="北京">
      <button class="btn" onclick="loadWeather()">查询</button>
    </div>
    <div id="weatherBox"><div class="empty">正在加载天气…</div></div>
  </div>
</section>

<section id="files">
  <div class="sec-head"><h2>📁 文件存放</h2></div>
  <p class="sec-desc">点击上传，把文件存进小站（存于本机浏览器中）。</p>
  <div class="card">
    <div class="drop" onclick="document.getElementById('fileInput').click()">
      <div class="big">🎀</div>
      <p><b>点击选择文件上传</b><br><small>图片、文档、压缩包都可以～</small></p>
    </div>
    <input id="fileInput" type="file" multiple hidden onchange="handleFiles(this.files,'file')">
    <div id="fileList" class="file-list"></div>
  </div>
</section>

<section id="videos">
  <div class="sec-head"><h2>🎬 视频存放</h2></div>
  <p class="sec-desc">上传喜欢的视频，随时在线播放～</p>
  <div class="card">
    <div class="drop" onclick="document.getElementById('videoInput').click()">
      <div class="big">🍿</div>
      <p><b>点击选择视频上传</b><br><small>mp4 / webm 格式效果最好～</small></p>
    </div>
    <input id="videoInput" type="file" accept="video/*" multiple hidden onchange="handleFiles(this.files,'video')">
    <div id="videoList" class="file-list"></div>
  </div>
</section>

<footer>
  🎀 韩立的后宫 · 姚蔓.xyz · 用 💖 搭建<br>
  <small>今天也要开开心心的哦～</small>
</footer>

<script>
/* ============ 天气（免费接口 Open-Meteo，无需密钥） ============ */
const CODE = {0:"☀️",1:"🌤️",2:"⛅",3:"☁️",45:"🌫️",48:"🌫️",51:"🌦️",53:"🌦️",55:"🌦️",56:"🌧️",57:"🌧️",61:"🌧️",63:"🌧️",65:"🌧️",66:"🌧️",67:"🌧️",71:"🌨️",73:"🌨️",75:"🌨️",77:"🌨️",80:"🌦️",81:"🌧️",82:"⛈️",85:"🌨️",86:"🌨️",95:"⛈️",96:"⛈️",99:"⛈️"};
const TXT = {0:"晴朗",1:"大致晴朗",2:"多云",3:"阴天",45:"有雾",48:"有雾",51:"毛毛雨",53:"毛毛雨",55:"毛毛雨",61:"小雨",63:"中雨",65:"大雨",66:"冻雨",67:"冻雨",71:"小雪",73:"中雪",75:"大雪",77:"雪",80:"小阵雨",81:"阵雨",82:"强阵雨",85:"小阵雪",86:"大阵雪",95:"雷暴",96:"雷暴",99:"雷暴"};
const DAY = ["周日","周一","周二","周三","周四","周五","周六"];

async function loadWeather(){
  const box = document.getElementById("weatherBox");
  const city = document.getElementById("cityInput").value.trim() || "北京";
  box.innerHTML = '<div class="empty">正在查询 '+city+' …</div>';
  try{
    const g = await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(city)+"&count=1&language=zh").then(r=>r.json());
    if(!g.results || !g.results.length){ box.innerHTML='<div class="empty">没有找到这个城市，换个名字试试～</div>'; return; }
    const p = g.results[0];
    const w = await fetch("https://api.open-meteo.com/v1/forecast?latitude="+p.latitude+"&longitude="+p.longitude+"&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto").then(r=>r.json());
    const c = w.current;
    let html = '<div class="weather-now">'
      + '<div class="w-icon">'+(CODE[c.weather_code]||"🌈")+'</div>'
      + '<div><div class="w-temp">'+Math.round(c.temperature_2m)+'°C</div>'
      + '<div class="w-meta">'+p.name+' · '+(TXT[c.weather_code]||"未知")+' · 湿度 '+c.relative_humidity_2m+'% · 风速 '+c.wind_speed_10m+' km/h</div></div></div>';
    html += '<div class="w-days">';
    for(let i=0;i<Math.min(5,w.daily.time.length);i++){
      const d = new Date(w.daily.time[i]);
      html += '<div class="w-day"><div class="d">'+DAY[d.getDay()]+'</div><div class="i">'+(CODE[w.daily.weather_code[i]]||"🌈")+'</div><div>'+Math.round(w.daily.temperature_2m_min[i])+'° ~ '+Math.round(w.daily.temperature_2m_max[i])+'°</div></div>';
    }
    html += '</div>';
    box.innerHTML = html;
  }catch(e){
    box.innerHTML = '<div class="empty">网络开小差了，稍后再试～（天气需要联网才能显示）</div>';
  }
}
loadWeather();

/* ============ 文件/视频存放（IndexedDB 本机存储） ============ */
let db;
const req = indexedDB.open("hanli-netdisk", 1);
req.onupgradeneeded = e => { e.target.result.createObjectStore("files",{keyPath:"id",autoIncrement:true}); };
req.onsuccess = e => { db = e.target.result; renderList("file"); renderList("video"); };

function saveFile(file, category){
  const reader = new FileReader();
  reader.onload = () => {
    db.transaction("files","readwrite").objectStore("files").add({
      name:file.name, type:file.type, size:file.size, category:category, data:reader.result
    }).onsuccess = () => { renderList(category); };
  };
  reader.readAsDataURL(file);
}
function handleFiles(files, category){
  [...files].forEach(f => saveFile(f, category));
}
function deleteFile(id, category){
  db.transaction("files","readwrite").objectStore("files").delete(id).onsuccess = () => renderList(category);
}
function fmtSize(b){
  if(b<1024) return b+" B";
  if(b<1048576) return (b/1024).toFixed(1)+" KB";
  return (b/1048576).toFixed(1)+" MB";
}
function renderList(category){
  const box = document.getElementById(category==="file"?"fileList":"videoList");
  const tx = db.transaction("files","readonly").objectStore("files");
  const all = tx.getAll();
  all.onsuccess = () => {
    const items = all.result.filter(x=>x.category===category).sort((a,b)=>b.id-a.id);
    if(!items.length){ box.innerHTML = '<div class="empty">这里还空空的，先上传一个吧～</div>'; return; }
    box.innerHTML = "";
    items.forEach(x => {
      const div = document.createElement("div");
      div.className = "file-item";
      const icon = category==="video" ? "🎬" : (/image\//.test(x.type)?"🖼️":/audio\//.test(x.type)?"🎵":/pdf/.test(x.type)?"📕":"📄");
      let inner = '<span class="fi">'+icon+'</span><span class="fn" title="'+x.name+'">'+x.name+'</span><span class="fs">'+fmtSize(x.size)+'</span>'
        + '<a class="btn small ghost" href="'+x.data+'" download="'+x.name+'">下载</a>'
        + '<button class="btn small" onclick="deleteFile('+x.id+', \''+category+'\')">删除</button>';
      div.innerHTML = inner;
      if(category==="video"){
        const v = document.createElement("video");
        v.controls = true; v.src = x.data;
        div.appendChild(v);
        div.style.flexWrap = "wrap";
      }
      box.appendChild(div);
    });
  };
}
</script>
</body>
</html>
