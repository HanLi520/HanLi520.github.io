<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>韩立的后宫 🎀 | 姚蔓.xyz</title>
<style>
  :root{
    --bg:#1a0b14; --card:#2d1823; --pink:#ff69b4; --pink2:#ff9ecb;
    --deep:#d63384; --text:#ffe0ef; --muted:#b06a8f; --line:#4a2c3d;
    --glass:rgba(255, 105, 180, 0.1); --glass-border:rgba(255, 105, 180, 0.3);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.7;
    background-image:radial-gradient(circle at 15% 20%, #3a1525 0, transparent 40%),
                     radial-gradient(circle at 85% 80%, #2a1020 0, transparent 40%);
    min-height: 100vh; overflow-x: hidden;
  }
  .sakura {
    position: fixed; top: -10px; z-index: 0; pointer-events: none;
    background: #ffb7c5; border-radius: 50% 0 50% 50%;
    animation: fall linear forwards;
  }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
  }
  .page { display: none; position: relative; z-index: 1; animation: fadeIn 0.4s ease; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
  header { text-align: center; padding: 40px 20px 20px; }
  .avatar-box {
    width: 100px; height: 100px; margin: 0 auto 15px;
    border-radius: 50%; overflow: hidden; border: 3px solid var(--pink);
    box-shadow: 0 0 20px rgba(255,105,180,0.4);
  }
  .avatar-box svg { width: 100%; height: 100%; }
  h1 { font-size: 26px; color: var(--pink); margin-bottom: 5px; }
  .tagline { color: var(--muted); font-size: 14px; }
  section { max-width: 600px; margin: 0 auto; padding: 15px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 18px; margin-bottom: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  }
  .card h2 { font-size: 18px; color: var(--pink); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }

  /* 音乐播放器 */
  .music-player { display: flex; align-items: center; gap: 12px; background: rgba(255,105,180,0.1); padding: 12px; border-radius: 15px; border: 1px solid var(--glass-border); }
  .music-player audio { display: none; }
  .music-controls { display: flex; gap: 6px; }
  .music-btn {
    width: 40px; height: 40px; border-radius: 50%; background: var(--pink); border: none;
    color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 10px rgba(255,105,180,0.3);
  }
  .music-btn:active { transform: scale(0.92); }
  .music-info { flex: 1; overflow: hidden; }
  .music-info .title { font-size: 14px; font-weight: bold; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .music-info .artist { font-size: 12px; color: var(--muted); }
  .music-select {
    width: 100%; margin-top: 10px; padding: 8px; border-radius: 10px;
    background: var(--card); color: var(--text); border: 1px solid var(--line);
    font-size: 14px; outline: none;
  }

  /* 十二生肖 */
  .zodiac-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .zodiac-item {
    aspect-ratio: 1/1; background: var(--glass); border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 1px solid var(--glass-border); transition: 0.2s; cursor: pointer;
    font-size: 32px; gap: 4px;
  }
  .zodiac-item .name { font-size: 12px; color: var(--muted); }
  .zodiac-item:active { transform: scale(0.95); }

  /* 消消乐 */
  .game-header { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 15px; align-items: center; }
  .game-header b { color: var(--pink); font-size: 18px; }
  .match3-board { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; max-width: 360px; margin: 0 auto; background: rgba(0,0,0,0.2); border-radius: 15px; padding: 6px; border: 1px solid var(--line); }
  .match3-tile {
    aspect-ratio: 1/1; background: rgba(255,255,255,0.05); border-radius: 8px;
    display: flex; align-items: center; justify-content: center; font-size: 22px;
    cursor: pointer; transition: all 0.15s; user-select: none; border: 1px solid rgba(255,255,255,0.05);
  }
  .match3-tile.selected { background: var(--pink); transform: scale(0.85); box-shadow: 0 0 10px var(--pink); }
  .match3-tile.matched { animation: pop 0.3s forwards; }
  @keyframes pop { to { transform: scale(0); opacity: 0; } }
  .restart-btn { padding: 8px 16px; border-radius: 99px; background: var(--pink); color: #fff; border: none; font-size: 13px; cursor: pointer; font-weight: bold; }

  /* 底栏 */
  .tab-bar {
    position: fixed; bottom: 0; left: 0; width: 100%; height: 60px;
    background: rgba(26, 11, 20, 0.95); backdrop-filter: blur(10px);
    border-top: 1px solid var(--line); display: flex; justify-content: space-around;
    align-items: center; z-index: 999;
  }
  .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; cursor: pointer; }
  .tab-item.active { color: var(--pink); font-weight: bold; }
  .tab-item .icon { font-size: 20px; margin-bottom: 2px; }
</style>
</head>
<body>

<div id="page-home" class="page active">
  <header>
    <div class="avatar-box">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <rect width="200" height="200" fill="#1a1a1a"/>
        <circle cx="55" cy="55" r="28" fill="#8d5524"/><circle cx="55" cy="55" r="15" fill="#c68642"/>
        <circle cx="145" cy="55" r="28" fill="#8d5524"/><circle cx="145" cy="55" r="15" fill="#c68642"/>
        <ellipse cx="100" cy="105" rx="65" ry="60" fill="#8d5524"/>
        <ellipse cx="100" cy="120" rx="45" ry="35" fill="#f1c27d"/>
        <line x1="60" y1="80" x2="85" y2="88" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
        <line x1="140" y1="80" x2="115" y2="88" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
        <circle cx="75" cy="95" r="8" fill="#1a1a1a"/><circle cx="125" cy="95" r="8" fill="#1a1a1a"/>
        <circle cx="78" cy="92" r="3" fill="#fff"/><circle cx="128" cy="92" r="3" fill="#fff"/>
        <ellipse cx="100" cy="112" rx="14" ry="10" fill="#1a1a1a"/>
        <path d="M 85,130 Q 100,145 115,130" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
        <path d="M 40,165 Q 100,195 160,165 L 160,200 L 40,200 Z" fill="#d32f2f"/>
        <path d="M 80,165 L 100,175 L 120,165" fill="none" stroke="#fff" stroke-width="2" opacity="0.5"/>
      </svg>
    </div>
    <h1>韩立的后宫 🎀</h1>
    <p class="tagline">欢迎来到我的小天地</p>
  </header>
  <section>
    <div class="card">
      <h2>🎵 每日推荐</h2>
      <div class="music-player">
        <div class="music-controls">
          <button class="music-btn" onclick="prevSong()">⏮</button>
          <button class="music-btn" id="playBtn" onclick="toggleMusic()">▶</button>
          <button class="music-btn" onclick="nextSong()">⏭</button>
        </div>
        <div class="music-info">
          <div class="title" id="songTitle">准备就绪</div>
          <div class="artist" id="songArtist">点击播放按钮</div>
        </div>
      </div>
      <select class="music-select" id="musicSelect" onchange="selectSong(this.value)"></select>
      <audio id="bgMusic" loop></audio>
    </div>
    <div class="card">
      <h2>🌟 十二生肖</h2>
      <div class="zodiac-grid">
        <div class="zodiac-item">🐭<span class="name">鼠</span></div>
        <div class="zodiac-item">🐮<span class="name">牛</span></div>
        <div class="zodiac-item">🐯<span class="name">虎</span></div>
        <div class="zodiac-item">🐰<span class="name">兔</span></div>
        <div class="zodiac-item">🐲<span class="name">龙</span></div>
        <div class="zodiac-item">🐍<span class="name">蛇</span></div>
        <div class="zodiac-item">🐴<span class="name">马</span></div>
        <div class="zodiac-item">🐑<span class="name">羊</span></div>
        <div class="zodiac-item">🐵<span class="name">猴</span></div>
        <div class="zodiac-item">🐔<span class="name">鸡</span></div>
        <div class="zodiac-item">🐶<span class="name">狗</span></div>
        <div class="zodiac-item">🐷<span class="name">猪</span></div>
      </div>
    </div>
  </section>
</div>

<div id="page-game" class="page">
  <header>
    <h1>🍬 消消乐</h1>
    <p class="tagline">点击交换相邻的水果，三个连成线即可消除！</p>
  </header>
  <section>
    <div class="card">
      <div class="game-header">
        <span>得分: <b id="m3Score">0</b></span>
        <button class="restart-btn" onclick="initMatch3()">重新开始</button>
      </div>
      <div class="match3-board" id="match3Board"></div>
    </div>
  </section>
</div>

<div class="tab-bar">
  <div class="tab-item active" data-page="home" onclick="switchTab('home', this)">
    <span class="icon">🏠</span><span>主页</span>
  </div>
  <div class="tab-item" data-page="game" onclick="switchTab('game', this)">
    <span class="icon">🎮</span><span>游戏</span>
  </div>
</div>

<script>
// ================== 1. 页面切换 ==================
function switchTab(pageName, element) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + pageName).classList.add('active');
  document.querySelectorAll('.tab-item').forEach(item => item.classList.remove('active'));
  if (element) element.classList.add('active');
}

// ================== 2. 樱花特效 ==================
function createSakura() {
  const sakura = document.createElement('div');
  sakura.className = 'sakura';
  const size = Math.random() * 10 + 8;
  sakura.style.width = size + 'px';
  sakura.style.height = size + 'px';
  sakura.style.left = Math.random() * 100 + 'vw';
  sakura.style.animationDuration = (Math.random() * 5 + 5) + 's';
  sakura.style.opacity = Math.random() * 0.5 + 0.3;
  document.body.appendChild(sakura);
  setTimeout(() => { sakura.remove(); }, 10000);
}
setInterval(createSakura, 300);

// ================== 3. 音乐播放列表 ==================
const playlist = [
  { title: "我的音乐 1", artist: "未知", url: "https://hanli520.github.io/5_6334776616400460370.mp3" },
  { title: "我的音乐 2", artist: "未知", url: "https://hanli520.github.io/5_6073492341077837047.mp3" },
  { title: "我的音乐 3", artist: "未知", url: "https://hanli520.github.io/5_6316300105179734366.mp3" }
];

let currentSongIndex = 0;
const bgMusic = document.getElementById('bgMusic');
const playBtn = document.getElementById('playBtn');
const songTitle = document.getElementById('songTitle');
const songArtist = document.getElementById('songArtist');
const musicSelect = document.getElementById('musicSelect');
let isPlaying = false;

function initMusicPlayer() {
  musicSelect.innerHTML = '';
  playlist.forEach((song, index) => {
    const option = document.createElement('option');
    option.value = index;
    option.text = song.title;
    musicSelect.appendChild(option);
  });
  loadSong(0);
}

function loadSong(index) {
  currentSongIndex = index;
  const song = playlist[index];
  bgMusic.src = song.url;
  songTitle.innerText = song.title;
  songArtist.innerText = song.artist;
  musicSelect.value = index;
  isPlaying = false;
  playBtn.innerHTML = '▶';
}

function toggleMusic() {
  if (!bgMusic.src) return;
  if (isPlaying) {
    bgMusic.pause(); playBtn.innerHTML = '▶';
  } else {
    bgMusic.play().catch(e => alert('音乐加载失败，请检查链接'));
    playBtn.innerHTML = '⏸';
  }
  isPlaying = !isPlaying;
}

function nextSong() {
  let nextIndex = (currentSongIndex + 1) % playlist.length;
  loadSong(nextIndex);
  bgMusic.play().catch(e => alert('播放失败'));
  playBtn.innerHTML = '⏸'; isPlaying = true;
}

function prevSong() {
  let prevIndex = (currentSongIndex - 1 + playlist.length) % playlist.length;
  loadSong(prevIndex);
  bgMusic.play().catch(e => alert('播放失败'));
  playBtn.innerHTML = '⏸'; isPlaying = true;
}

function selectSong(index) {
  loadSong(parseInt(index));
  bgMusic.play().catch(e => alert('播放失败'));
  playBtn.innerHTML = '⏸'; isPlaying = true;
}

// ================== 4. 消消乐游戏逻辑 ==================
const ROWS = 6;
const COLS = 6;
const FRUITS = ['🍎', '🍊', '🍇', '🍓', '🍒', '🍋'];
let m3Board = [];
let m3Score = 0;
let selectedTile = null;
let isProcessing = false;

function initMatch3() {
  m3Board = [];
  m3Score = 0;
  selectedTile = null;
  isProcessing = false;
  document.getElementById('m3Score').innerText = '0';
  
  // 生成没有初始三连的棋盘
  do {
    m3Board = [];
    for (let r = 0; r < ROWS; r++) {
      let row = [];
      for (let c = 0; c < COLS; c++) {
        let fruit;
        do {
          fruit = FRUITS[Math.floor(Math.random() * FRUITS.length)];
        } while (
          (c >= 2 && row[c-1] === fruit && row[c-2] === fruit) ||
          (r >= 2 && m3Board[r-1][c] === fruit && m3Board[r-2][c] === fruit)
        );
        row.push(fruit);
      }
      m3Board.push(row);
    }
  } while (checkMatches().length > 0);

  renderBoard();
}

function renderBoard() {
  const boardEl = document.getElementById('match3Board');
  boardEl.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const tile = document.createElement('div');
      tile.className = 'match3-tile';
      tile.innerText = m3Board[r][c];
      tile.dataset.r = r;
      tile.dataset.c = c;
      tile.onclick = () => handleTileClick(r, c);
      boardEl.appendChild(tile);
    }
  }
}

function handleTileClick(r, c) {
  if (isProcessing) return;
  
  if (selectedTile) {
    const [sr, sc] = selectedTile;
    // 点击同一个取消
    if (sr === r && sc === c) {
      selectedTile = null;
      renderBoard();
      return;
    }
    // 判断是否相邻
    if (Math.abs(sr - r) + Math.abs(sc - c) === 1) {
      // 交换
      [m3Board[sr][sc], m3Board[r][c]] = [m3Board[r][c], m3Board[sr][sc]];
      const matches = checkMatches();
      if (matches.length > 0) {
        selectedTile = null;
        isProcessing = true;
        renderBoard();
        processMatches(matches);
      } else {
        // 换回来
        [m3Board[sr][sc], m3Board[r][c]] = [m3Board[r][c], m3Board[sr][sc]];
        selectedTile = null;
        renderBoard();
      }
    } else {
      selectedTile = [r, c];
      renderBoard();
      highlightTile(r, c);
    }
  } else {
    selectedTile = [r, c];
    renderBoard();
    highlightTile(r, c);
  }
}

function highlightTile(r, c) {
  const boardEl = document.getElementById('match3Board');
  const index = r * COLS + c;
  if (boardEl.children[index]) {
    boardEl.children[index].classList.add('selected');
  }
}

function checkMatches() {
  let matches = [];
  // 横向
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS - 2; c++) {
      let fruit = m3Board[r][c];
      if (!fruit) continue;
      let len = 1;
      while (c + len < COLS && m3Board[r][c + len] === fruit) len++;
      if (len >= 3) {
        for (let i = 0; i < len; i++) matches.push([r, c + i]);
        c += len - 1;
      }
    }
  }
  // 纵向
  for (let c = 0; c < COLS; c++) {
    for (let r = 0; r < ROWS - 2; r++) {
      let fruit = m3Board[r][c];
      if (!fruit) continue;
      let len = 1;
      while (r + len < ROWS && m3Board[r + len][c] === fruit) len++;
      if (len >= 3) {
        for (let i = 0; i < len; i++) matches.push([r + i, c]);
        r += len - 1;
      }
    }
  }
  // 去重
  return Array.from(new Set(matches.map(m => m.join(',')))).map(s => s.split(',').map(Number));
}

function processMatches(matches) {
  m3Score += matches.length * 10;
  document.getElementById('m3Score').innerText = m3Score;

  // 标记消除
  matches.forEach(([r, c]) => {
    m3Board[r][c] = null;
    const index = r * COLS + c;
    const tile = document.getElementById('match3Board').children[index];
    if (tile) tile.classList.add('matched');
  });

  // 等待动画后下落和补充
  setTimeout(() => {
    applyGravity();
    refillBoard();
    renderBoard();
    
    // 连锁反应
    const newMatches = checkMatches();
    if (newMatches.length > 0) {
      processMatches(newMatches);
    } else {
      isProcessing = false;
      selectedTile = null;
    }
  }, 300);
}

function applyGravity() {
  for (let c = 0; c < COLS; c++) {
    let emptyRow = ROWS - 1;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (m3Board[r][c] !== null) {
        [m3Board[emptyRow][c], m3Board[r][c]] = [m3Board[r][c], m3Board[emptyRow][c]];
        emptyRow--;
      }
    }
  }
}

function refillBoard() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (m3Board[r][c] === null) {
        m3Board[r][c] = FRUITS[Math.floor(Math.random() * FRUITS.length)];
      }
    }
  }
}

// ================== 5. 初始化 ==================
window.onload = function() {
  initMusicPlayer();
  initMatch3();
};
</script>
</body>
</html>
